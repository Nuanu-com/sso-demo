{{ define "claims" }}
{{ if . }}
<table class="table w-full text-sm">
  <thead>
    <tr class="border-b border-border text-left text-muted-foreground">
      <th class="py-2 pr-4 font-medium">claim</th>
      <th class="py-2 font-medium">value</th>
    </tr>
  </thead>
  <tbody>
    {{ range . }}
    <tr class="border-b border-border/50 align-top">
      <td class="py-2 pr-4 font-mono">{{ .Name }}</td>
      <td class="py-2 font-mono break-all">
        {{ .Value }}
        {{ if .Note }}<span class="ml-2 text-muted-foreground not-italic">({{ .Note }})</span>{{ end }}
      </td>
    </tr>
    {{ end }}
  </tbody>
</table>
{{ else }}
<p class="text-sm text-muted-foreground">No claims to show.</p>
{{ end }}
{{ end }}
